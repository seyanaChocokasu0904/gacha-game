<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ガチャ専門webゲーム</title>
<style>
  :root{
    --cyan:#0d7f96; --cyan-dark:#095b6c; --pink:#f5a8c4; --border:#1a1a1a;
    --aspect:16/9;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; font-family:"Hiragino Sans","Yu Gothic",sans-serif; overflow:hidden; }
  body{
    background:
      repeating-linear-gradient(115deg, rgba(150,150,150,.06) 0 1px, transparent 1px 7px),
      repeating-linear-gradient(25deg, rgba(150,150,150,.05) 0 1px, transparent 1px 9px),
      #fff;
  }
  #app{
    position:relative; width:100%; height:100%; max-width:1200px; max-height:100vh;
    margin:0 auto; aspect-ratio:var(--aspect); display:flex; align-items:center; justify-content:center;
    background:#fff;
  }
  .screen{ position:absolute; inset:0; display:none; }
  .screen.active{ display:flex; }

  .btn{
    font-family:inherit; cursor:pointer; border:none; border-radius:10px;
    padding:13px 18px; font-size:15px; font-weight:700; background:var(--cyan); color:#fff;
  }
  .btn:hover{ background:var(--cyan-dark); }
  .btn:disabled{ background:#b9c4c6; cursor:not-allowed; }
  .btn.danger{ background:#b6425a; }
  .btn.danger:hover{ background:#8f2f42; }

  /* Title */
  #screen-title{ flex-direction:column; align-items:center; justify-content:space-between; padding:6% 4%; }
  #title-heading{
    font-size:clamp(24px,5vw,50px); font-weight:900; color:#000; text-align:center; margin-top:4%;
    text-shadow:-2px -2px #fff,2px -2px #fff,-2px 2px #fff,2px 2px #fff,-3px 0 #fff,3px 0 #fff,0 -3px #fff,0 3px #fff;
  }
  #title-buttons{ display:flex; gap:16px; margin-bottom:4%; }
  #title-buttons .btn{ min-width:130px; }

  /* Options */
  #screen-options{ flex-direction:column; padding:3% 6%; overflow-y:auto; }
  .opt-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 6px; border-bottom:1px solid #ddd; gap:14px; flex-wrap:wrap; }
  .opt-row label{ font-weight:700; }
  #options-back{ align-self:center; margin-top:16px; }

  .toast{
    position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
    background:var(--cyan-dark); color:#fff; padding:9px 18px; border-radius:20px; font-size:13px;
    opacity:0; pointer-events:none; transition:opacity .3s; z-index:999;
  }
  .toast.show{ opacity:1; }

  /* Home / Charlist (share sidebar layout) */
  .with-sidebar{ flex-direction:row; }
  .sidebar{ width:100px; min-width:100px; background:var(--pink); display:flex; flex-direction:column; border-right:4px solid var(--border); }
  .sidebar .side-item{
    flex:1; display:flex; align-items:center; justify-content:center; text-align:center;
    color:#fff; font-weight:700; font-size:13px; border-bottom:3px solid var(--border); cursor:pointer; padding:4px;
  }
  .sidebar .side-item:last-child{ border-bottom:none; }
  .sidebar .side-item.current{ background:rgba(0,0,0,.12); }

  #home-main{
    position:relative; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    background:linear-gradient(180deg, #78c2f4 0%, #6cbf7a 55%, #59ae3c 100%);
  }
  #save-btn-wrap{ position:absolute; top:12px; right:16px; text-align:right; }
  #save-btn{ background:var(--cyan); color:#000; font-weight:800; padding:9px 16px; border-radius:8px; cursor:pointer; }
  #username-display{ font-size:12px; margin-top:4px; }

  .door-box{ position:relative; width:52%; max-width:440px; aspect-ratio:16/9; border-radius:6px; overflow:hidden; box-shadow:0 10px 26px rgba(0,0,0,.35); }
  .door-box img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .door-box .door-open{ opacity:0; transition:opacity .5s ease; }
  .door-box .glow{
    position:absolute; left:49%; top:9%; bottom:32%; width:3%; transform:translateX(-50%);
    background:radial-gradient(ellipse at center, rgba(255,255,255,.95), rgba(255,255,255,0));
    filter:blur(4px); opacity:.35; transition:opacity .3s, background .3s;
  }
  .door-box .glow.silver{ background:radial-gradient(ellipse at center, rgba(230,238,244,1), rgba(190,205,215,0)); }

  #door-stage{ flex:1; width:100%; display:flex; align-items:center; justify-content:center; }
  #pull-buttons{ display:flex; gap:14px; padding:3% 0 4%; }

  #charlist-main{ flex:1; padding:14px 20px; overflow-y:auto; }
  .rarity-block h3{ margin:6px 0; border-left:6px solid var(--cyan); padding-left:8px; }
  .char-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(80px,1fr)); gap:10px; margin-bottom:18px; }
  .char-cell{
    aspect-ratio:1/1; border-radius:8px; overflow:hidden; cursor:pointer; position:relative;
    display:flex; align-items:center; justify-content:center; text-align:center;
    color:#fff; font-weight:700; font-size:11px; padding:2px;
  }
  .char-cell.locked{ filter:grayscale(1) brightness(.55); }
  .char-cell .badge{ position:absolute; bottom:2px; right:3px; background:rgba(0,0,0,.6); color:#fff; font-size:10px; padding:1px 5px; border-radius:8px; }

  /* Overlays (shared) */
  .overlay{ position:absolute; inset:0; z-index:50; background:rgba(10,10,12,.94); display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; }
  .hidden{ display:none !important; }

  #gate-hint{ margin-top:16px; font-size:14px; text-align:center; line-height:1.6; }
  #gate-hint b{ font-size:20px; letter-spacing:.08em; }
  #skip-gate-btn{ margin-top:14px; background:#444; color:#ddd; font-size:12px; padding:7px 14px; }

  #card-scene{ display:none; flex-direction:column; align-items:center; justify-content:center; width:100%; height:100%; cursor:pointer; }
  #card-progress{ position:absolute; top:14px; font-size:13px; color:#ccc; }
  #card-box{ position:relative; width:min(44%,280px); aspect-ratio:2/3; }
  .card-face{
    position:absolute; inset:0; border-radius:14px; border:3px solid #f0e6c8; overflow:hidden;
    display:flex; flex-direction:column; box-shadow:0 12px 26px rgba(0,0,0,.6); transition:opacity .3s ease;
  }
  #card-back{ background:radial-gradient(circle at 50% 50%,#3a2a5c,#1b1330 70%); align-items:center; justify-content:center; font-size:44px; color:#cbb8ff; }
  #card-front{ background:#111; opacity:0; }
  #card-front.show{ opacity:1; }
  #card-back.hide{ opacity:0; }
  #card-front .art{ flex:1; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; text-align:center; padding:8px; color:#fff; }
  #card-front img.art{ object-fit:cover; }
  #card-front .info{ padding:8px; text-align:center; }
  #card-front .rarity{ font-weight:900; letter-spacing:.06em; }
  #card-tap-hint{ margin-top:14px; font-size:12px; color:#aaa; }

  #result-end{ display:none; flex-direction:column; align-items:center; gap:16px; }
  #result-buttons{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; max-width:80%; }

  #char-detail-box{ background:#1a1a1a; border-radius:14px; padding:22px; width:min(78%,340px); text-align:center; border:2px solid #444; }
  #char-detail-box .art{ width:65%; margin:0 auto 12px; aspect-ratio:1/1; border-radius:10px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; object-fit:cover; }
  #char-detail-box .art.zoomable{ cursor:zoom-in; box-shadow:0 0 0 2px var(--cyan); }
  #char-detail-box .zoom-hint{ font-size:11px; color:#8fd6e6; margin:-6px 0 10px; }
  #full-image-overlay{ z-index:60; cursor:zoom-out; flex-direction:column; }
  #full-image-overlay img{ max-width:90%; max-height:80%; object-fit:contain; border-radius:8px; box-shadow:0 12px 30px rgba(0,0,0,.6); }
  #full-image-hint{ margin-top:14px; font-size:12px; color:#aaa; }

  #confirm-box{ background:#1a1a1a; border-radius:14px; padding:24px 26px; text-align:center; border:2px solid #444; max-width:320px; }
  #confirm-message{ margin:0 0 18px; font-size:15px; }
  #confirm-buttons{ display:flex; gap:14px; justify-content:center; }
  #confirm-no{ background:#555; }
  #confirm-no:hover{ background:#333; }

  select, input[type=text]{ font-family:inherit; padding:7px 10px; border-radius:6px; border:1px solid #999; }
  input[type=range]{ width:150px; }
</style>
</head>
<body>
<div id="app">

  <!-- TITLE -->
  <section id="screen-title" class="screen active">
    <div></div>
    <div id="title-heading">ガチャ専門webゲーム</div>
    <div id="title-buttons">
      <button class="btn" id="btn-start">はじめから</button>
      <button class="btn" id="btn-continue">つづける</button>
      <button class="btn" id="btn-options-title">オプション</button>
    </div>
  </section>

  <!-- OPTIONS -->
  <section id="screen-options" class="screen">
    <h2 style="text-align:center">オプション</h2>
    <div class="opt-row"><label>音量調整</label>
      <div><input type="range" id="opt-volume" min="0" max="100"><span id="opt-volume-val"></span></div>
    </div>
    <div class="opt-row"><label>画角調整</label>
      <select id="opt-aspect">
        <option value="16/9">横長 (16:9)</option>
        <option value="4/3">標準 (4:3)</option>
        <option value="9/16">縦長 (スマホ)</option>
      </select>
    </div>
    <div class="opt-row"><label>演出オン/オフ</label>
      <div><input type="checkbox" id="opt-effects"> 演出を有効にする</div>
    </div>
    <div class="opt-row"><label>ユーザー名変更</label>
      <div><input type="text" id="opt-username" maxlength="12"> <button class="btn" id="opt-username-save">変更</button></div>
    </div>
    <div class="opt-row"><label>データの初期化</label>
      <button class="btn danger" id="opt-data-init">初期化する</button>
    </div>
    <div class="opt-row"><label>データ破棄（タイトルへ）</label>
      <button class="btn danger" id="opt-data-delete">破棄する</button>
    </div>
    <button class="btn" id="options-back">もどる</button>
  </section>

  <!-- HOME -->
  <section id="screen-home" class="screen with-sidebar">
    <aside class="sidebar">
      <div class="side-item current" data-nav="home">ホーム</div>
      <div class="side-item" data-nav="charlist">キャラ<br>所持一覧</div>
      <div class="side-item" data-nav="options">オプション</div>
    </aside>
    <div id="home-main">
      <div id="save-btn-wrap">
        <div id="save-btn">データ保存</div>
        <div id="username-display"></div>
      </div>
      <div id="door-stage">
        <div class="door-box">
          <img id="home-door-closed">
          <img class="door-open" id="home-door-open">
          <div class="glow"></div>
        </div>
      </div>
      <div id="pull-buttons">
        <button class="btn" data-pull="1">1連</button>
        <button class="btn" data-pull="10">10連</button>
        <button class="btn" data-pull="100">100連</button>
      </div>
    </div>
  </section>

  <!-- CHAR LIST -->
  <section id="screen-charlist" class="screen with-sidebar">
    <aside class="sidebar">
      <div class="side-item" data-nav="home">ホーム</div>
      <div class="side-item current" data-nav="charlist">キャラ<br>所持一覧</div>
      <div class="side-item" data-nav="options">オプション</div>
    </aside>
    <div id="charlist-main">
      <h2>キャラ所持一覧</h2>
      <div id="charlist-content"></div>
    </div>
  </section>

  <!-- PULL OVERLAY -->
  <div id="pull-overlay" class="overlay hidden">
    <div id="gate-scene">
      <div class="door-box" id="gate2">
        <img id="door2-closed">
        <img class="door-open" id="door2-open">
        <div class="glow" id="gate2-glow"></div>
      </div>
      <div id="gate-hint">キーボードの <b>D</b> と <b>G</b> を同時に押して扉をこじ開けろ！</div>
      <button class="btn" id="skip-gate-btn">演出をスキップ</button>
    </div>
    <div id="card-scene">
      <div id="card-progress"></div>
      <div id="card-box">
        <div id="card-back" class="card-face">✦</div>
        <div id="card-front" class="card-face"></div>
      </div>
      <div id="card-tap-hint">画面をクリックして次へ</div>
    </div>
    <div id="result-end">
      <h2>結果</h2>
      <div id="result-tally"></div>
      <div id="result-buttons">
        <button class="btn" id="res-home">ホームへ戻る</button>
        <button class="btn" data-pull="1">つづけて1連</button>
        <button class="btn" data-pull="10">つづけて10連</button>
        <button class="btn" data-pull="100">つづけて100連</button>
      </div>
    </div>
  </div>

  <!-- CHAR DETAIL OVERLAY -->
  <div id="char-detail-overlay" class="overlay hidden">
    <div id="char-detail-box"></div>
  </div>

  <!-- FULL IMAGE VIEW (ハイパーレア・ウルトラレア専用) -->
  <div id="full-image-overlay" class="overlay hidden">
    <img id="full-image-img">
    <div id="full-image-hint">クリックして閉じる</div>
  </div>

  <!-- CONFIRM MODAL -->
  <div id="confirm-overlay" class="overlay hidden">
    <div id="confirm-box">
      <p id="confirm-message"></p>
      <div id="confirm-buttons">
        <button class="btn" id="confirm-yes">はい</button>
        <button class="btn" id="confirm-no">いいえ</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <audio id="bgm" loop></audio>
</div>

/* ---- 1. キャラDB（img を書けば実画像。書かなければ自動でレアリティ色のプレースホルダー） ---- */
const CHAR_DB = {
uncommon:[{id:'unc_01',name:'アンコモン1',img:'images/gatya_ankomon1.png'},{id:'unc_02',name:'アンコモン2',img:'images/gatya_ankomon2.png'},{id:'unc_03',name:'アンコモン3',img:'images/gatya_ankomon3.png'},{id:'unc_04',name:'アンコモン4',img:'images/gatya_ankomon4.png'},{id:'unc_05',name:'アンコモン5',img:'images/gatya_ankomon5.jpg'}],
  common:[{id:'com_01',name:'コモン1',img:'images/gatya_komon1.png'},{id:'com_02',name:'コモン2',img:'images/gatya_komon2.png'},{id:'com_03',name:'コモン3',img:'images/gatya_komon3.png'},{id:'com_04',name:'コモン4',img:'images/gatya_komon4.png'},{id:'com_05',name:'コモン5',img:'images/gatya_komon5.png'}],
  rare:[{id:'rare_01',name:'レア1',img:'images/gatya_rea1.jpg'},{id:'rare_02',name:'レア2',img:'images/gatya_rea2.png'},{id:'rare_03',name:'レア3',img:'images/gatya_rea3.png'}],
  superrare:[{id:'sr_01',name:'スーパーレア1',img:'images/gatya_su-pa-rea1.png'},{id:'sr_02',name:'スーパーレア2',img:'images/gatya_su-pa-rea2.png'}],
  hyperrare:[{id:'hr_01',name:'ハイパーレア1',img:'images/ガチャ素材＿HR2.jpeg'}],
  ultrarare:[{id:'ur_01',name:'ウルトラレア1',img:'images/ガチャ素材＿UR1.jpeg'}]
};
const RARITY_ORDER = ['uncommon','common','rare','superrare','hyperrare','ultrarare'];
const RARITY_LABEL = {uncommon:'アンコモン',common:'コモン',rare:'レア',superrare:'スーパーレア',hyperrare:'ハイパーレア',ultrarare:'ウルトラレア'};
const RARITY_COLOR = {uncommon:'#7a8c99',common:'#3f8f5e',rare:'#2f6fd1',superrare:'#9a3fd1',hyperrare:'#d18a2f',ultrarare:'#d13f5c'};

// 100連あたりの想定排出数（上振れ／中間／下振れ）を重みとして使う
const RARITY_WEIGHTS = {
  up:  {uncommon:95,common:50,rare:30,superrare:23,hyperrare:7,ultrarare:2},
  mid: {uncommon:90,common:45,rare:25,superrare:13,hyperrare:3,ultrarare:1},
  down:{uncommon:85,common:39,rare:15,superrare:7, hyperrare:1,ultrarare:0}
};
const MODE_WEIGHTS = {up:20, mid:30, down:50}; // 100連10セット中 上振れ2:中間3:下振れ5

function weightedPick(w){
  const entries = Object.entries(w).filter(([,v])=>v>0);
  let r = Math.random() * entries.reduce((s,[,v])=>s+v,0);
  for(const [k,v] of entries){ if(r<v) return k; r-=v; }
  return entries[entries.length-1][0];
}
function findChar(id){
  for(const r of RARITY_ORDER){ const c = CHAR_DB[r].find(c=>c.id===id); if(c) return {char:c, rarity:r}; }
}

/* ---- 2. セーブ（localStorage / 自サーバーで開いた際に更新後も保持されます） ---- */
const SAVE_KEY = 'gacha_web_game_save_v1';
const defaultState = ()=>({ username:'プレイヤー', totalPulls:0, batchIndex:-1, batchMode:null, owned:{}, settings:{volume:50, aspect:'16/9', effects:true} });
let state = load() || defaultState();
bgm.volume = state.settings.volume/100;

function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const p = JSON.parse(raw);
    return Object.assign(defaultState(), p, {owned:p.owned||{}, settings:Object.assign(defaultState().settings, p.settings||{})});
  }catch(e){ return null; }
}
function save(msg){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); if(msg) toast('データを保存しました'); }
  catch(e){ if(msg) toast('保存に失敗しました'); }
}
function hasSave(){ try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; } }

let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 1600);
}

/* ---- 5. ガチャ抽選 ---- */
function getBatchMode(){
  const idx = Math.floor(state.totalPulls/100);
  if(state.batchIndex !== idx || !state.batchMode){ state.batchMode = weightedPick(MODE_WEIGHTS); state.batchIndex = idx; }
  return state.batchMode;
}
function drawOne(){
  const mode = getBatchMode();
  const rarity = weightedPick(RARITY_WEIGHTS[mode]);
  const pool = CHAR_DB[rarity];
  const char = pool[Math.floor(Math.random()*pool.length)];
  state.totalPulls++;
  state.owned[char.id] = (state.owned[char.id]||0) + 1;
  return {char, rarity, mode};
}

/* ---- 6. ガチャ演出：扉 → カード → 結果 ---- */
const overlay = document.getElementById('pull-overlay');
const gateScene = document.getElementById('gate-scene');
const cardScene = document.getElementById('card-scene');
const resultEnd = document.getElementById('result-end');
const door2Open = document.getElementById('door2-open');
const gate2Glow = document.getElementById('gate2-glow');
const cardBack = document.getElementById('card-back');
const cardFront = document.getElementById('card-front');
const cardProgress = document.getElementById('card-progress');

let pullQueue = [], pullIndex = 0, doorOpened = false;
let keysDown = new Set();

window.addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if(k==='d'||k==='g') keysDown.add(k);
  if(keysDown.has('d') && keysDown.has('g')) tryOpenDoor();
});
window.addEventListener('keyup', e=> keysDown.delete(e.key.toLowerCase()));

function startPulls(n){
  pullQueue = []; for(let i=0;i<n;i++) pullQueue.push(drawOne());
  save();

  pullIndex = 0; doorOpened = false;
  overlay.classList.remove('hidden');
  gateScene.style.display='flex'; cardScene.style.display='none'; resultEnd.style.display='none';
  door2Open.style.opacity = 0; gate2Glow.style.opacity = .35;
  gate2Glow.classList.toggle('silver', pullQueue[0].mode==='up');

  if(!state.settings.effects) openDoor();
}
function tryOpenDoor(){ if(gateScene.style.display==='flex') openDoor(); }
function openDoor(){
  if(doorOpened) return;
  doorOpened = true;
  door2Open.style.opacity = 1;
  gate2Glow.style.opacity = 1;
  setTimeout(showCardScene, state.settings.effects ? 500 : 0);
}
document.getElementById('skip-gate-btn').addEventListener('click', openDoor);

function showCardScene(){
  gateScene.style.display='none';
  cardScene.style.display='flex';
  renderCard();
}
function renderCard(){
  const item = pullQueue[pullIndex];
  const color = RARITY_COLOR[item.rarity];
  cardFront.classList.remove('show');
  cardBack.classList.remove('hide');
  cardProgress.textContent = `${pullIndex+1} / ${pullQueue.length}`;

  const artHtml = item.char.img
    ? `<img class="art" src="${item.char.img}">`
    : `<div class="art" style="background:linear-gradient(160deg, ${color}, #10131a)">${item.char.name}</div>`;
  cardFront.innerHTML = `${artHtml}
    <div class="info"><div class="rarity" style="color:${color}">${RARITY_LABEL[item.rarity]}</div><div>${item.char.name}</div></div>`;

  const reveal = ()=>{ cardBack.classList.add('hide'); cardFront.classList.add('show'); };
  if(state.settings.effects) setTimeout(reveal, 150); else reveal();
}
cardScene.addEventListener('click', ()=>{
  pullIndex++;
  if(pullIndex >= pullQueue.length){ showResultEnd(); return; }
  renderCard();
});
function showResultEnd(){
  cardScene.style.display='none';
  resultEnd.style.display='flex';
  const tally = {}; RARITY_ORDER.forEach(r=>tally[r]=0);
  pullQueue.forEach(it=>tally[it.rarity]++);
  document.getElementById('result-tally').innerHTML = RARITY_ORDER
    .map(r=>`<span style="color:${RARITY_COLOR[r]}">${RARITY_LABEL[r]}</span>: ${tally[r]}体`).join(' ／ ');
}
document.getElementById('res-home').addEventListener('click', ()=>{ overlay.classList.add('hidden'); save(); showScreen('home'); });
document.querySelectorAll('[data-pull]').forEach(btn=> btn.addEventListener('click', ()=> startPulls(Number(btn.dataset.pull))));

/* ---- 7. キャラ所持一覧 ---- */
function renderCharList(){
  const wrap = document.getElementById('charlist-content');
  wrap.innerHTML = '';
  RARITY_ORDER.forEach(rarity=>{
    const block = document.createElement('div');
    block.className='rarity-block';
    block.innerHTML = `<h3 style="border-left-color:${RARITY_COLOR[rarity]}">${RARITY_LABEL[rarity]}</h3>`;
    const grid = document.createElement('div');
    grid.className='char-grid';
    CHAR_DB[rarity].forEach(char=>{
      const owned = state.owned[char.id]||0;
      const cell = document.createElement('div');
      cell.className = 'char-cell' + (owned===0 ? ' locked':'');
      if(char.img){ cell.innerHTML = `<img src="${char.img}" style="width:100%;height:100%;object-fit:cover">`; }
      else{ cell.style.background = `linear-gradient(160deg, ${RARITY_COLOR[rarity]}, #222)`; cell.textContent = owned>0 ? char.name : '？？？'; }
      if(owned>0) cell.innerHTML += `<div class="badge">×${owned}</div>`;
      cell.addEventListener('click', ()=> showCharDetail(char.id));
      grid.appendChild(cell);
    });
    block.appendChild(grid);
    wrap.appendChild(block);
  });
}
const charDetailOverlay = document.getElementById('char-detail-overlay');
const ZOOMABLE_RARITIES = ['hyperrare','ultrarare']; // このレアリティのみイラスト全体表示に対応
function showCharDetail(id){
  const found = findChar(id); if(!found) return;
  const {char, rarity} = found;
  const owned = state.owned[id]||0;
  const color = RARITY_COLOR[rarity];
  const canZoom = owned>0 && char.img && ZOOMABLE_RARITIES.includes(rarity);
  const artHtml = owned>0
    ? (char.img
        ? `<img class="art${canZoom?' zoomable':''}" id="char-detail-art" src="${char.img}">`
        : `<div class="art" style="background:linear-gradient(160deg, ${color}, #222)">${char.name}</div>`)
    : `<div class="art" style="background:#333">？？？</div>`;
  document.getElementById('char-detail-box').innerHTML = `
    ${artHtml}
    ${canZoom ? '<p class="zoom-hint">イラストをクリックすると全体を表示します</p>' : ''}
    <h2 style="color:${color}">${owned>0 ? char.name : '未所持キャラ'}</h2>
    <p>レアリティ：<b style="color:${color}">${RARITY_LABEL[rarity]}</b></p>
    <p>所持数：${owned}体</p>
    <p style="font-size:12px;color:#aaa;line-height:1.6">100連あたりの想定排出数<br>
      上振れ ${RARITY_WEIGHTS.up[rarity]}回 ／ 中間 ${RARITY_WEIGHTS.mid[rarity]}回 ／ 下振れ ${RARITY_WEIGHTS.down[rarity]}回</p>
    <button class="btn" id="char-detail-close">とじる</button>`;
  charDetailOverlay.classList.remove('hidden');
  document.getElementById('char-detail-close').addEventListener('click', ()=> charDetailOverlay.classList.add('hidden'));
  if(canZoom){
    document.getElementById('char-detail-art').addEventListener('click', ()=> showFullImage(char.img));
  }
}

/* ---- 全体イラスト表示（ハイパーレア・ウルトラレア） ---- */
const fullImageOverlay = document.getElementById('full-image-overlay');
const fullImageImg = document.getElementById('full-image-img');
function showFullImage(src){
  fullImageImg.src = src;
  fullImageOverlay.classList.remove('hidden');
}
fullImageOverlay.addEventListener('click', ()=> fullImageOverlay.classList.add('hidden'));

/* ---- 8. 初期化 ---- */
document.getElementById('btn-continue').disabled = !hasSave();
document.documentElement.style.setProperty('--aspect', state.settings.aspect);

})();
</script>
